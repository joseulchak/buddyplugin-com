<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buddy - Idle Animation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0f1d;
      --bg-gradient: radial-gradient(circle at 50% 40%, #172642 0%, #0d1527 50%, #060913 100%);
      --accent-cyan: #7ef5ff;
      --accent-blue: #4fc5e4;
      --accent-deep-blue: #4c65c8;
      --accent-orange: #ff7b3d;
      --primary-navy: #172744;
      --card-bg: rgba(23, 39, 68, 0.45);
      --card-border: rgba(126, 245, 255, 0.15);
      --text-main: #f0f6fc;
      --text-muted: #8b9bb4;
      --idle-duration: 4s;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      height: 100vh;
      max-height: 100vh;
      width: 100vw;
      overflow: hidden;
      background: var(--bg-dark);
      background-image: var(--bg-gradient);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }

    /* Ambient background grid & glow */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      pointer-events: none;
      z-index: 0;
    }

    .ambient-glow {
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(79, 197, 228, 0.18) 0%, rgba(76, 101, 200, 0.08) 50%, transparent 70%);
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      filter: blur(40px);
      z-index: 0;
      animation: ambientPulse 6s ease-in-out infinite alternate;
    }

    @keyframes ambientPulse {
      0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.6; }
      100% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.95; }
    }

    /* Top Navigation / Status Header */
    header {
      width: 100%;
      max-width: 900px;
      padding: 16px 20px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
      flex-shrink: 0;
    }

    .logo-badge {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 6px 14px;
      border-radius: 100px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 12px #10b981;
      animation: dotPulse 2s infinite ease-in-out;
    }

    @keyframes dotPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }

    .status-text {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #7ef5ff;
    }

    .status-sub {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .hint-chip {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 6px 14px;
      border-radius: 100px;
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(8px);
    }

    /* Stage Area */
    .stage {
      position: relative;
      width: 100%;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 5;
      perspective: 1000px;
      cursor: pointer;
      padding: 10px 20px;
    }

    /* Character Container */
    .character-wrap {
      position: relative;
      height: 100%;
      max-height: min(58vh, 440px);
      width: auto;
      aspect-ratio: 1080 / 932.21;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
      transition: transform 0.15s ease-out;
    }

    /* Floating Shadow below Buddy */
    .character-shadow {
      position: absolute;
      bottom: -15px;
      width: 65%;
      height: 28px;
      background: radial-gradient(ellipse at center, rgba(8, 14, 26, 0.8) 0%, rgba(8, 14, 26, 0.3) 50%, transparent 75%);
      border-radius: 50%;
      filter: blur(5px);
      transform-origin: center;
      animation: shadowPulse var(--idle-duration) ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes shadowPulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.75;
      }
      50% {
        transform: scale(0.85);
        opacity: 0.35;
      }
    }

    /* SVG Character Styling */
    .buddy-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 18px 30px rgba(0, 0, 0, 0.45));
    }

    /* -------------------------------------------------------------
       IDLE ANIMATIONS & SECONDARY MOTIONS (CSS-DRIVEN)
       ------------------------------------------------------------- */
    
    /* Main Float Cycle */
    #buddy-character {
      transform-origin: 546px 522px;
      animation: buddyIdleFloat var(--idle-duration) ease-in-out infinite;
      will-change: transform;
    }

    @keyframes buddyIdleFloat {
      0%, 100% {
        transform: translateY(0px) rotate(0deg) scale(1, 1);
      }
      25% {
        transform: translateY(-8px) rotate(-0.6deg) scale(0.995, 1.006);
      }
      50% {
        transform: translateY(-18px) rotate(0.4deg) scale(0.99, 1.012);
      }
      75% {
        transform: translateY(-8px) rotate(0.7deg) scale(0.995, 1.006);
      }
    }

    /* Hair Secondary Motion (Lagging wave) */
    #character-hair {
      transform-origin: 546px 200px;
      animation: hairIdleWave var(--idle-duration) ease-in-out infinite;
      will-change: transform;
    }

    @keyframes hairIdleWave {
      0%, 100% {
        transform: rotate(0deg) translateY(0);
      }
      30% {
        transform: rotate(1.6deg) translateY(-2px);
      }
      70% {
        transform: rotate(-1.4deg) translateY(1.5px);
      }
    }

    /* Eyebrow Micro-Float & Breathing */
    .eyebrow-item {
      transform-origin: center;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      animation: eyebrowIdle var(--idle-duration) ease-in-out infinite;
    }

    @keyframes eyebrowIdle {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-3px);
      }
    }

    /* Headphones subtle spring */
    #layer-headphones-front {
      transform-origin: 546px 522px;
      animation: headphonesIdle var(--idle-duration) ease-in-out infinite;
    }

    @keyframes headphonesIdle {
      0%, 100% {
        transform: scale(1) translateY(0);
      }
      50% {
        transform: scale(1.008) translateY(-1px);
      }
    }

    /* Mouth subtle breathing smile */
    #mouth-group {
      transform-origin: 550px 670px;
      animation: mouthIdle var(--idle-duration) ease-in-out infinite;
    }

    @keyframes mouthIdle {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02, 0.98); }
    }

    /* -------------------------------------------------------------
       EYES & BLINKING SYSTEM
       ------------------------------------------------------------- */
    
    .eye-container {
      /* Group holding the eye elements */
      transform-box: view-box;
    }

    /* Eyeball/Eyelid scaling for blinking */
    #eye-left-scale {
      transform-origin: 400.11px 518.96px;
      transform-box: view-box;
      will-change: transform;
    }

    #eye-right-scale {
      transform-origin: 696.81px 518.96px;
      transform-box: view-box;
      will-change: transform;
    }

    /* CSS Default Natural Blinking (Runs reliably without JS) */
    .auto-blink #eye-left-scale,
    .auto-blink #eye-right-scale {
      animation: organicBlink 5s ease-in-out infinite;
    }

    @keyframes organicBlink {
      0%, 42%, 46%, 76%, 80%, 100% {
        transform: scaleY(1);
      }
      44% {
        transform: scaleY(0.06); /* quick natural blink */
      }
      78% {
        transform: scaleY(0.06); /* quick double-blink */
      }
    }

    /* Eyebrow blink sync: micro-dip during blink */
    .auto-blink #layer-eyebrows {
      animation: eyebrowBlinkDip 5s ease-in-out infinite;
    }

    @keyframes eyebrowBlinkDip {
      0%, 42%, 46%, 76%, 80%, 100% {
        transform: translateY(0);
      }
      44%, 78% {
        transform: translateY(3.5px);
      }
    }

    /* Pupil Gaze / Tracking Layer */
    #eyes-pupil-group {
      transition: transform 0.12s cubic-bezier(0.2, 0, 0.2, 1);
      will-change: transform;
    }

    /* Manual / JS-triggered Blink Class */
    .is-blinking #eye-left-scale,
    .is-blinking #eye-right-scale {
      animation: none !important;
      transform: scaleY(0.06) !important;
    }

    .is-blinking #layer-eyebrows {
      transform: translateY(4px) !important;
    }

    /* Winking State (Right eye closed as cute arc) */
    .is-winking #eye-right-scale {
      display: none;
    }
    .is-winking #eye-right-wink {
      display: block !important;
      opacity: 1 !important;
    }
    .is-winking #eyebrow-right {
      transform: translateY(5px) rotate(3deg);
    }

    /* Click Bounce Reaction */
    .is-reacting #buddy-character {
      animation: buddyHappyBounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
    }

    @keyframes buddyHappyBounce {
      0% { transform: translateY(0) scale(1, 1); }
      30% { transform: translateY(12px) scale(1.12, 0.88); }
      60% { transform: translateY(-30px) scale(0.92, 1.14); }
      80% { transform: translateY(-4px) scale(1.04, 0.96); }
      100% { transform: translateY(0) scale(1, 1); }
    }

    /* Click particle bubble */
    .particle {
      position: absolute;
      pointer-events: none;
      font-size: 20px;
      animation: floatUpFade 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      z-index: 20;
    }

    @keyframes floatUpFade {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.5);
      }
      50% {
        transform: translate(calc(-50% + var(--dx)), calc(-50% - 40px)) scale(1.2);
        opacity: 0.9;
      }
      100% {
        transform: translate(calc(-50% + var(--dx) * 1.5), calc(-50% - 90px)) scale(0.8);
        opacity: 0;
      }
    }

    /* -------------------------------------------------------------
       BOTTOM CONTROLS & DASHBOARD
       ------------------------------------------------------------- */
    
    footer {
      width: 100%;
      max-width: 900px;
      padding: 8px 20px 18px;
      margin-bottom: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .controls-panel {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 10px 14px;
      border-radius: 20px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    .btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      padding: 9px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
    }

    .btn:hover {
      background: rgba(126, 245, 255, 0.15);
      border-color: rgba(126, 245, 255, 0.4);
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(126, 245, 255, 0.2);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn.active {
      background: linear-gradient(135deg, rgba(126, 245, 255, 0.3), rgba(76, 101, 200, 0.3));
      border-color: var(--accent-cyan);
      color: #fff;
      box-shadow: 0 0 15px rgba(126, 245, 255, 0.35);
    }

    .divider {
      width: 1px;
      height: 24px;
      background: rgba(255, 255, 255, 0.12);
      margin: 0 4px;
    }

    .speed-group {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 0, 0, 0.2);
      padding: 4px;
      border-radius: 10px;
    }

    .speed-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s;
    }

    .speed-btn:hover {
      color: #fff;
    }

    .speed-btn.active {
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
    }

    .footer-note {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
    }

    .footer-note span {
      color: var(--accent-cyan);
      font-weight: 600;
    }

    /* Responsive adjustments */
    @media (max-width: 640px) {
      .stage {
        height: 420px;
      }
      .character-wrap {
        max-width: 340px;
      }
      .character-shadow {
        width: 240px;
        height: 28px;
      }
      .btn {
        padding: 8px 12px;
        font-size: 12px;
      }
      .hint-chip {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- Ambient Grid & Glow -->
  <div class="bg-grid"></div>
  <div class="ambient-glow"></div>

  <!-- Header -->
  <header>
    <div class="logo-badge">
      <div class="status-dot"></div>
      <span class="status-text">Buddy</span>
      <span class="status-sub">• Idle Mode</span>
    </div>
    <div class="hint-chip">
      <span>💡 Clique no personagem ou mova o mouse</span>
    </div>
  </header>

  <!-- Interactive Character Stage -->

        <!-- Entire Character Group (Animates Idle Float & Squash/Stretch) -->

          <!-- Character Primary Layers -->

  <!-- Interactive Control Bar -->
  <footer>
    <div class="controls-panel">
      
      <!-- Blink Trigger -->
      <button class="btn" id="btn-blink" title="Fazer piscar os olhos agora">
        <span>👁️</span> Piscar
      </button>

      <!-- Wink Trigger -->
      <button class="btn" id="btn-wink" title="Alternar piscadinha charmosa">
        <span>😉</span> Piscar um olho
      </button>

      <!-- Pet / Cheer Reaction -->
      <button class="btn" id="btn-pet" title="Fazer carinho no Buddy!">
        <span>✨</span> Fazer Carinho
      </button>

      <div class="divider"></div>

      <!-- Mouse Tracking Toggle -->
      <button class="btn active" id="btn-gaze" title="Seguir o ponteiro do mouse com o olhar">
        <span>👀</span> Seguir Cursor
      </button>

      <div class="divider"></div>

      <!-- Speed Control -->
      <div class="speed-group" title="Velocidade da respiração idle">
        <button class="speed-btn" data-speed="5.5s">Calmo</button>
        <button class="speed-btn active" data-speed="4s">Normal</button>
        <button class="speed-btn" data-speed="2.6s">Ativo</button>
      </div>

    </div>

    <div class="footer-note">
      Personagem SVG animado em <span>Idle Position</span> • Ambos olhos abertos com reflexo e ciclo natural de piscadas
    </div>
  </footer>

  <script>
    (function() {
      // Elements
      const stage = document.getElementById('stage');
      const characterWrap = document.getElementById('character-wrap');
      const svg = document.getElementById('buddy-svg');
      const pupilsGroup = document.getElementById('eyes-pupil-group');
      const btnBlink = document.getElementById('btn-blink');
      const btnWink = document.getElementById('btn-wink');
      const btnPet = document.getElementById('btn-pet');
      const btnGaze = document.getElementById('btn-gaze');
      const speedBtns = document.querySelectorAll('.speed-btn');

      // State
      let gazeTrackingEnabled = true;
      let isWinking = false;
      let blinkTimeout = null;
      let organicBlinkTimer = null;
      let mouseX = 0, mouseY = 0;
      let currentEyeX = 0, currentEyeY = 0;
      let currentHeadTiltX = 0, currentHeadTiltY = 0;
      let isMouseOver = false;

      // -------------------------------------------------------------
      // 1. ORGANIC RANDOM BLINK CONTROLLER
      // -------------------------------------------------------------
      // Adds random variation to the blinking (e.g. 2.5s to 5.5s, with double-blinks)
      function triggerBlink(callback) {
        if (isWinking) return;

        svg.classList.remove('auto-blink');
        svg.classList.add('is-blinking');

        setTimeout(() => {
          svg.classList.remove('is-blinking');
          if (callback) callback();
        }, 160);
      }

      function scheduleNextOrganicBlink() {
        const nextInterval = 2800 + Math.random() * 3200; // between 2.8s and 6s
        organicBlinkTimer = setTimeout(() => {
          if (!isWinking) {
            triggerBlink(() => {
              // 30% chance of an immediate cute double-blink!
              if (Math.random() < 0.3) {
                setTimeout(() => {
                  triggerBlink(scheduleNextOrganicBlink);
                }, 140);
              } else {
                scheduleNextOrganicBlink();
              }
            });
          } else {
            scheduleNextOrganicBlink();
          }
        }, nextInterval);
      }

      // Start organic blink cycle
      scheduleNextOrganicBlink();

      // Manual Blink Button
      btnBlink.addEventListener('click', (e) => {
        e.stopPropagation();
        if (isWinking) setWink(false);
        triggerBlink();
        playCuteSound(580, 720);
      });

      // -------------------------------------------------------------
      // 2. WINK TOGGLE
      // -------------------------------------------------------------
      function setWink(state) {
        isWinking = state;
        if (isWinking) {
          svg.classList.remove('auto-blink');
          svg.classList.add('is-winking');
          btnWink.classList.add('active');
        } else {
          svg.classList.remove('is-winking');
          btnWink.classList.remove('active');
          // Resume natural blink
          svg.classList.add('auto-blink');
        }
      }

      btnWink.addEventListener('click', (e) => {
        e.stopPropagation();
        setWink(!isWinking);
        playCuteSound(isWinking ? 700 : 450, isWinking ? 880 : 380);
      });

      // -------------------------------------------------------------
      // 3. PET / HAPPY BOUNCE REACTION
      // -------------------------------------------------------------
      function triggerReaction(x, y) {
        svg.classList.add('is-reacting');
        spawnParticles(x, y);
        playCuteSound(520, 880, 'sine');

        // Quick playful wink during bounce if not already winking
        if (!isWinking) {
          setTimeout(() => {
            setWink(true);
            setTimeout(() => {
              setWink(false);
            }, 550);
          }, 150);
        }

        setTimeout(() => {
          svg.classList.remove('is-reacting');
        }, 650);
      }

      stage.addEventListener('click', (e) => {
        const rect = stage.getBoundingClientRect();
        const clickX = e.clientX || (rect.left + rect.width / 2);
        const clickY = e.clientY || (rect.top + rect.height / 2);
        triggerReaction(clickX, clickY);
      });

      btnPet.addEventListener('click', (e) => {
        e.stopPropagation();
        const rect = stage.getBoundingClientRect();
        triggerReaction(rect.left + rect.width / 2, rect.top + rect.height / 2);
      });

      // Particles effect (Hearts, stars, music notes)
      const emojis = ['✨', '💙', '⭐', '🎵', '💫', '🌸'];
      function spawnParticles(x, y) {
        const count = 5 + Math.floor(Math.random() * 4);
        for (let i = 0; i < count; i++) {
          const p = document.createElement('div');
          p.className = 'particle';
          p.innerText = emojis[Math.floor(Math.random() * emojis.length)];
          p.style.left = `${x}px`;
          p.style.top = `${y}px`;
          p.style.setProperty('--dx', `${(Math.random() - 0.5) * 120}px`);
          document.body.appendChild(p);

          setTimeout(() => {
            p.remove();
          }, 950);
        }
      }

      // -------------------------------------------------------------
      // 4. GAZE & MOUSE TRACKING
      // -------------------------------------------------------------
      btnGaze.addEventListener('click', (e) => {
        e.stopPropagation();
        gazeTrackingEnabled = !gazeTrackingEnabled;
        btnGaze.classList.toggle('active', gazeTrackingEnabled);
        if (!gazeTrackingEnabled) {
          // Reset gaze to center
          pupilsGroup.style.transform = 'translate(0px, 0px)';
          characterWrap.style.transform = 'rotateX(0deg) rotateY(0deg)';
        }
      });

      window.addEventListener('mousemove', (e) => {
        isMouseOver = true;
        const rect = stage.getBoundingClientRect();
        const stageCenterX = rect.left + rect.width / 2;
        const stageCenterY = rect.top + rect.height / 2;

        // Normalized offsets from center (-1 to 1)
        mouseX = (e.clientX - stageCenterX) / (window.innerWidth / 2);
        mouseY = (e.clientY - stageCenterY) / (window.innerHeight / 2);

        // Clamp
        mouseX = Math.max(-1, Math.min(1, mouseX));
        mouseY = Math.max(-1, Math.min(1, mouseY));
      });

      window.addEventListener('mouseleave', () => {
        isMouseOver = false;
        mouseX = 0;
        mouseY = 0;
      });

      // Smooth Animation Loop for Gaze & Parallax Lerp
      function updateGaze() {
        if (gazeTrackingEnabled) {
          const targetEyeX = mouseX * 22; // max ±22px pupil travel
          const targetEyeY = mouseY * 16; // max ±16px pupil travel
          const targetTiltY = mouseX * 7;  // 3D head tilt in deg
          const targetTiltX = -mouseY * 6;

          // Smooth lerp
          currentEyeX += (targetEyeX - currentEyeX) * 0.12;
          currentEyeY += (targetEyeY - currentEyeY) * 0.12;
          currentHeadTiltX += (targetTiltX - currentHeadTiltX) * 0.08;
          currentHeadTiltY += (targetTiltY - currentHeadTiltY) * 0.08;

          pupilsGroup.style.transform = `translate(${currentEyeX.toFixed(2)}px, ${currentEyeY.toFixed(2)}px)`;
          characterWrap.style.transform = `rotateX(${currentHeadTiltX.toFixed(2)}deg) rotateY(${currentHeadTiltY.toFixed(2)}deg)`;
        }
        requestAnimationFrame(updateGaze);
      }
      requestAnimationFrame(updateGaze);

      // -------------------------------------------------------------
      // 5. SPEED SELECTOR
      // -------------------------------------------------------------
      speedBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          speedBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const speed = btn.getAttribute('data-speed');
          document.documentElement.style.setProperty('--idle-duration', speed);
        });
      });

      // -------------------------------------------------------------
      // 6. SYNTHESIZED AUDIO FEEDBACK (Zero external files)
      // -------------------------------------------------------------
      let audioCtx = null;
      function playCuteSound(startFreq, endFreq, type = 'sine') {
        try {
          if (!audioCtx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (AudioContext) audioCtx = new AudioContext();
          }
          if (!audioCtx || audioCtx.state === 'suspended') {
            audioCtx && audioCtx.resume();
          }
          if (!audioCtx) return;

          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();

          osc.type = type;
          osc.frequency.setValueAtTime(startFreq, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(endFreq, audioCtx.currentTime + 0.15);

          gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start();
          osc.stop(audioCtx.currentTime + 0.19);
        } catch (err) {
          // Silent fallback if audio context not permitted
        }
      }

    })();
  </script>
</body>
